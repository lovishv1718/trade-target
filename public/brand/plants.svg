<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 560">
  <defs>
    <linearGradient id="l1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc46a"/>
      <stop offset="1" stop-color="#2f7d3c"/>
    </linearGradient>
    <linearGradient id="l2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6dc8a"/>
      <stop offset="1" stop-color="#4c9a4f"/>
    </linearGradient>
    <linearGradient id="l3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa95a"/>
      <stop offset="1" stop-color="#1f5f2e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <!-- One broad leaf, pointing right from its base at the origin -->
    <path id="leaf" d="M0 0C40 -46 128 -52 176 -6C128 34 44 36 0 0Z"/>
  </defs>
  <g filter="url(#soft)">
    <path d="M40 560C46 470 60 400 90 330" stroke="#2f6e36" stroke-width="5" fill="none"/>
    <path d="M30 560C26 470 18 420 -10 360" stroke="#2f6e36" stroke-width="4" fill="none"/>
    <use href="#leaf" fill="url(#l3)" transform="translate(-30 380) rotate(-35) scale(1.05)"/>
    <use href="#leaf" fill="url(#l1)" transform="translate(70 340) rotate(-70) scale(1.15)"/>
    <use href="#leaf" fill="url(#l2)" transform="translate(80 350) rotate(-20) scale(1.1)"/>
    <use href="#leaf" fill="url(#l1)" transform="translate(20 450) rotate(-5) scale(1.2)"/>
    <use href="#leaf" fill="url(#l3)" transform="translate(-40 300) rotate(-60) scale(0.95)"/>
    <use href="#leaf" fill="url(#l2)" transform="translate(10 520) rotate(18) scale(1.1)"/>
    <use href="#leaf" fill="url(#l1)" transform="translate(-30 470) rotate(-25) scale(0.9)"/>
  </g>
  <!-- Midribs catch the light -->
  <g stroke="#e9f7df" stroke-opacity="0.55" stroke-width="2" fill="none" filter="url(#soft)">
    <path d="M70 340l70 -150"/>
    <path d="M80 350l155 -55"/>
    <path d="M20 450l170 -15"/>
  </g>
</svg>
