<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c8ec"/>
      <stop offset="0.45" stop-color="#d6e5f6"/>
      <stop offset="1" stop-color="#f2f6fc"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.74" cy="0.02" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#fff8ea" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f6fb3"/>
      <stop offset="0.45" stop-color="#7fa9de"/>
      <stop offset="0.7" stop-color="#c6dcf5"/>
      <stop offset="1" stop-color="#5b88c6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c97cf"/>
      <stop offset="0.6" stop-color="#b3cfee"/>
      <stop offset="1" stop-color="#7ea5d8"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9dbde5"/>
      <stop offset="1" stop-color="#cfe0f4"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3edf9"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfdff2"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f6fc" stop-opacity="0"/>
      <stop offset="1" stop-color="#f2f6fc" stop-opacity="1"/>
    </linearGradient>
    <pattern id="win" width="16" height="11" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="16" height="1.4" fill="#ffffff" opacity="0.38"/>
      <rect x="0" y="0" width="1.2" height="11" fill="#1e3f73" opacity="0.18"/>
    </pattern>
    <pattern id="win2" width="22" height="14" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="22" height="1.6" fill="#ffffff" opacity="0.32"/>
      <rect x="0" y="0" width="1.4" height="14" fill="#ffffff" opacity="0.22"/>
    </pattern>
    <filter id="far" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="mid" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="near" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Far towers across the horizon -->
  <g filter="url(#far)" opacity="0.85">
    <rect x="420" y="250" width="70" height="400" fill="url(#g3)"/>
    <rect x="500" y="300" width="56" height="350" fill="url(#g4)"/>
    <rect x="575" y="210" width="80" height="440" fill="url(#g3)"/>
    <rect x="670" y="320" width="64" height="330" fill="url(#g4)"/>
    <rect x="760" y="270" width="90" height="380" fill="url(#g3)"/>
    <rect x="870" y="330" width="60" height="320" fill="url(#g4)"/>
    <rect x="950" y="240" width="78" height="410" fill="url(#g3)"/>
    <rect x="1045" y="300" width="66" height="350" fill="url(#g4)"/>
    <rect x="1125" y="260" width="72" height="390" fill="url(#g3)"/>
  </g>

  <!-- Left: mid towers -->
  <g filter="url(#mid)">
    <rect x="210" y="150" width="110" height="560" fill="url(#g2)"/>
    <rect x="210" y="150" width="110" height="560" fill="url(#win2)"/>
    <rect x="330" y="230" width="90" height="480" fill="url(#g3)"/>
    <rect x="330" y="230" width="90" height="480" fill="url(#win2)"/>
    <path d="M210 150l55 -40l55 40z" fill="#b8d1ef"/>
  </g>
  <!-- Left: near towers, sharpest -->
  <g filter="url(#near)">
    <rect x="-20" y="40" width="140" height="760" fill="url(#g1)"/>
    <rect x="-20" y="40" width="140" height="760" fill="url(#win)"/>
    <rect x="-20" y="40" width="140" height="760" fill="url(#shine)"/>
    <rect x="128" y="110" width="80" height="690" fill="url(#g2)"/>
    <rect x="128" y="110" width="80" height="690" fill="url(#win)"/>
    <rect x="45" y="0" width="8" height="40" fill="#7fa3d4"/>
  </g>

  <!-- Right: mid towers -->
  <g filter="url(#mid)">
    <rect x="1215" y="200" width="96" height="520" fill="url(#g3)"/>
    <rect x="1215" y="200" width="96" height="520" fill="url(#win2)"/>
    <rect x="1320" y="120" width="110" height="600" fill="url(#g2)"/>
    <rect x="1320" y="120" width="110" height="600" fill="url(#win2)"/>
    <path d="M1320 120l55 -36l55 36z" fill="#b8d1ef"/>
  </g>
  <!-- Right: near towers -->
  <g filter="url(#near)">
    <rect x="1440" y="60" width="90" height="740" fill="url(#g2)"/>
    <rect x="1440" y="60" width="90" height="740" fill="url(#win)"/>
    <rect x="1530" y="20" width="110" height="780" fill="url(#g1)"/>
    <rect x="1530" y="20" width="110" height="780" fill="url(#win)"/>
    <rect x="1530" y="20" width="110" height="780" fill="url(#shine)"/>
  </g>

  <!-- Sunlight from the top right, and the haze the page rises out of -->
  <rect width="1600" height="900" fill="url(#sun)"/>
  <rect y="420" width="1600" height="480" fill="url(#haze)"/>
</svg>
